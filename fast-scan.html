<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fast Track Scanner | CWIE</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #ffffff; padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; position: relative; z-index: 10; border-bottom: 2px solid #2563eb; }
    .camera-container { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
    #reader { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    #reader__dashboard_section, #reader__status_span, #reader__header_message { display: none !important; }
    
    /* กรอบสแกน */
    .scan-box { position: absolute; width: 70%; max-width: 400px; height: 120px; border: 4px solid rgba(255, 255, 255, 0.8); border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); z-index: 5; }
    .scan-box::after { content: ""; position: absolute; left: 10px; right: 10px; top: 50%; height: 3px; background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: scanLine 2s linear infinite; }
    @keyframes scanLine { 0% { transform: translateY(-40px); } 50% { transform: translateY(40px); } 100% { transform: translateY(-40px); } }

    /* จอ Overlay สำหรับโชว์ชื่อ (จะเด้งขึ้นมาบังกล้องชั่วคราว) */
    .result-overlay { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.95); z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .result-icon { font-size: 5rem; margin-bottom: 20px; }
    .result-name { font-size: 2.2rem; font-weight: 800; line-height: 1.3; margin-bottom: 10px; word-break: break-word; }
    .result-status { font-size: 1.2rem; font-weight: 600; color: #64748b; }
    
    .btn-start-camera { position: absolute; z-index: 15; padding: 15px 30px; font-size: 1.2rem; font-weight: 700; border-radius: 50px; background: #2563eb; color: white; border: none; box-shadow: 0 10px 20px rgba(37,99,235,0.3); }
  </style>
</head>
<body>

  <div class="header">
    <h4 class="mb-0 fw-bold text-primary"><i class="fa-solid fa-bolt me-2 text-warning"></i>สแกนด่วนต่อเนื่อง (Fast Track)</h4>
    <div class="small text-muted fw-bold mt-1">ระบบจะบันทึกข้อมูลอัตโนมัติทันทีที่สแกนสำเร็จ</div>
  </div>

  <div class="camera-container">
    <button id="btnStart" class="btn-start-camera" onclick="startCamera()"><i class="fa-solid fa-camera me-2"></i>เปิดกล้องสแกน</button>
    <div id="reader"></div>
    <div class="scan-box" id="scanBox" style="display:none;"></div>
    
    <!-- จอแสดงผล (Overlay) -->
    <div id="resultOverlay" class="result-overlay">
      <div id="resIcon" class="result-icon text-primary"><i class="fa-solid fa-spinner fa-spin"></i></div>
      <div id="resName" class="result-name text-dark">กำลังตรวจสอบ...</div>
      <div id="resStatus" class="result-status">โปรดรอสักครู่</div>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let isScanning = false;
    let isCooldown = false; // ป้องกันการสแกนเบิ้ล

    // ฟังก์ชันจัดการ Overlay
    function showOverlay(iconHtml, nameText, statusText, colorClass) {
      const overlay = document.getElementById('resultOverlay');
      document.getElementById('resIcon').innerHTML = iconHtml;
      document.getElementById('resName').innerHTML = nameText;
      document.getElementById('resName').className = `result-name ${colorClass}`;
      document.getElementById('resStatus').innerHTML = statusText;
      overlay.style.display = 'flex';
    }

    function hideOverlay() {
      document.getElementById('resultOverlay').style.display = 'none';
    }

    // เสียงแจ้งเตือน
    function playBeep(type = 'success') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        
        if (type === 'success') { osc.frequency.setValueAtTime(880, ctx.currentTime); gain.gain.value = 0.1; } 
        else { osc.frequency.setValueAtTime(300, ctx.currentTime); gain.gain.value = 0.2; }
        
        osc.start(); osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    // 1. รับผลการสแกน
    function onScanSuccess(decodedText) {
      if (isCooldown) return;
      isCooldown = true;
      playBeep('success');

      // โชว์สถานะกำลังโหลด
      showOverlay('<i class="fa-solid fa-spinner fa-spin text-primary"></i>', 'กำลังตรวจสอบ...', 'โปรดรอสักครู่...', 'text-dark');

      // ส่งข้อมูลกลับไปให้ Google Apps Script จัดการ
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "FAST_SCAN", value: decodedText }, "*");
      } else {
        showOverlay('<i class="fa-solid fa-triangle-exclamation text-danger"></i>', 'ข้อผิดพลาด', 'ขาดการเชื่อมต่อกับหน้าเว็บหลัก', 'text-danger');
        setTimeout(() => { hideOverlay(); isCooldown = false; }, 3000);
      }
    }

    // 2. รอรับข้อความตอบกลับจาก Google Apps Script ว่าบันทึกสำเร็จไหม
    window.addEventListener("message", (event) => {
      const data = event.data;
      if (data && data.type === "FAST_SCAN_RESULT") {
        if (data.success) {
          showOverlay('<i class="fa-solid fa-circle-check text-success"></i>', data.name, 'บันทึกข้อมูลเรียบร้อยแล้ว', 'text-success');
        } else {
          playBeep('error');
          showOverlay('<i class="fa-solid fa-circle-xmark text-danger"></i>', 'ไม่สามารถบันทึกได้', data.message, 'text-danger');
        }
        
        // หน่วงเวลา 2.5 วินาที แล้วปิด Overlay เพื่อพร้อมสแกนคนต่อไป
        setTimeout(() => {
          hideOverlay();
          isCooldown = false;
        }, 2500);
      }
    });

    // ==========================================
    // ระบบกล้อง (ยกมาจากระบบเดิม)
    // ==========================================
    function isMobileOrTablet() {
      const ua = navigator.userAgent || "";
      return (/Android/i.test(ua) || /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1));
    }

    async function startCamera() {
      if (isScanning) return;
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('scanBox').style.display = 'block';

      try {
        html5QrCode = new Html5Qrcode("reader");
        const scanConfig = { fps: 15, qrbox: { width: 300, height: 100 }, aspectRatio: 16/9, disableFlip: true };

        if (isMobileOrTablet()) {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
          const deviceId = stream.getVideoTracks()[0].getSettings().deviceId;
          stream.getTracks().forEach(t => t.stop());
          
          await html5QrCode.start({ deviceId: { exact: deviceId } }, scanConfig, onScanSuccess, () => {});
        } else {
          await html5QrCode.start({ facingMode: "environment" }, scanConfig, onScanSuccess, () => {});
        }
        isScanning = true;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้: " + err);
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('scanBox').style.display = 'none';
      }
    }
  </script>
</body>
</html>
