<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fast Track Scanner | CWIE</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden;}
    
    .header { background: #ffffff; padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; position: relative; z-index: 10; border-bottom: 2px solid #10b981; }
    
    .camera-container { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
    #reader { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    #reader__dashboard_section, #reader__status_span, #reader__header_message { display: none !important; }
    
    /* กรอบเล็งบาร์โค้ด */
    .scan-box { position: absolute; width: 75%; max-width: 400px; height: 120px; border: 4px solid rgba(255, 255, 255, 0.8); border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); z-index: 5; pointer-events: none;}
    .scan-box::after { content: ""; position: absolute; left: 10px; right: 10px; top: 50%; height: 3px; background: #10b981; box-shadow: 0 0 12px #10b981; animation: scanLine 2s linear infinite; }
    @keyframes scanLine { 0% { transform: translateY(-40px); } 50% { transform: translateY(40px); } 100% { transform: translateY(-40px); } }

    /* จอ Overlay สำหรับโชว์ชื่อ */
    .result-overlay { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.95); z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .result-icon { font-size: 5.5rem; margin-bottom: 20px; }
    .result-name { font-size: 2.2rem; font-weight: 800; line-height: 1.3; margin-bottom: 10px; word-break: break-word; }
    .result-status { font-size: 1.2rem; font-weight: 600; color: #64748b; }
    
    .btn-start-camera { position: absolute; z-index: 15; padding: 16px 35px; font-size: 1.2rem; font-weight: 800; border-radius: 50px; background: #10b981; color: white; border: none; box-shadow: 0 10px 25px rgba(16,185,129,0.4); }
    
    /* ปุ่มไฟฉาย (Floating Button) */
    .btn-torch { position: absolute; top: 20px; right: 20px; z-index: 15; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); color: white; border: 2px solid rgba(255,255,255,0.5); font-size: 1.2rem; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; }
    .btn-torch.active { background: #f59e0b; border-color: #f59e0b; color: #fff; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5); }
  </style>
</head>
<body>

  <div class="header">
    <h4 class="mb-0 fw-bold text-success"><i class="fa-solid fa-bolt me-2 text-warning"></i>สแกนด่วนต่อเนื่อง</h4>
    <div class="small text-muted fw-bold mt-1">โหมด Fast Track บันทึกอัตโนมัติ (ห้ามปิดหน้าต่างนี้)</div>
  </div>

  <div class="camera-container">
    <button id="btnStart" class="btn-start-camera" onclick="startCamera()"><i class="fa-solid fa-camera me-2"></i>เปิดกล้องสแกน</button>
    <button id="btnTorch" class="btn-torch" onclick="toggleTorch()"><i class="fa-solid fa-lightbulb"></i></button>
    
    <div id="reader"></div>
    <div class="scan-box" id="scanBox" style="display:none;"></div>
    
    <div id="resultOverlay" class="result-overlay">
      <div id="resIcon" class="result-icon text-primary"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
      <div id="resName" class="result-name text-dark">กำลังตรวจสอบ...</div>
      <div id="resStatus" class="result-status">โปรดรอสักครู่</div>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let isScanning = false;
    let isCooldown = false; 
    let isTorchOn = false;

    function showOverlay(iconHtml, nameText, statusText, colorClass) {
      const overlay = document.getElementById('resultOverlay');
      document.getElementById('resIcon').innerHTML = iconHtml;
      document.getElementById('resName').innerHTML = nameText;
      document.getElementById('resName').className = `result-name ${colorClass}`;
      document.getElementById('resStatus').innerHTML = statusText;
      overlay.style.display = 'flex';
    }

    function hideOverlay() {
      document.getElementById('resultOverlay').style.display = 'none';
    }

    function playBeep(type = 'success') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'success') { osc.frequency.setValueAtTime(880, ctx.currentTime); gain.gain.value = 0.1; } 
        else { osc.frequency.setValueAtTime(300, ctx.currentTime); gain.gain.value = 0.2; }
        osc.start(); osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

   // 1. อ่านพิกัด URL และ API Key ที่ส่งมาจากเว็บหลัก
    const urlParams = new URLSearchParams(window.location.search);
    const API_URL = urlParams.get('apiUrl') || "";
    const API_KEY = urlParams.get('apiKey') || "";

    // 2. เมื่อกล้องอ่านบาร์โค้ดได้
    async function onScanSuccess(decodedText) {
      if (isCooldown) return;
      
      // 🔴 [เพิ่มใหม่] กรองเอาเฉพาะตัวเลข และเช็กความยาว (ดักจับเศษบาร์โค้ด)
      const cleanId = String(decodedText).replace(/\D/g, '');
      if (cleanId.length < 8) return; // ถ้ารหัสสั้นกว่า 8 หลัก ให้กล้องเมินเฉยและสแกนต่อไปเลย

      isCooldown = true;
      playBeep('success');

      showOverlay('<i class="fa-solid fa-circle-notch fa-spin text-primary"></i>', 'กำลังตรวจสอบ...', 'โปรดรอสักครู่...', 'text-dark');

      // ป้องกันการแอบเปิดหน้าเว็บโดยไม่มีลิงก์ API
      if (!API_URL) {
        showOverlay('<i class="fa-solid fa-triangle-exclamation text-danger"></i>', 'ข้อผิดพลาด', 'ไม่พบลิงก์เชื่อมต่อ API', 'text-danger');
        setTimeout(() => { hideOverlay(); isCooldown = false; }, 3000);
        return;
      }

      try {
        // 3. ยิง API ตรงเข้าเซิร์ฟเวอร์ Google Apps Script
        const response = await fetch(API_URL, {
          method: "POST",
          redirect: "follow", 
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ studentId: cleanId, apiKey: API_KEY }) // 🔴 เปลี่ยนไปส่งค่า cleanId ที่กรองแล้วแทน
        });

        // 4. รอรับผลลัพธ์
        const data = await response.json();
        
        if (data.success) {
          showOverlay('<i class="fa-solid fa-circle-check text-success"></i>', data.name, 'บันทึกข้อมูลเรียบร้อยแล้ว', 'text-success');
        } else {
          playBeep('error');
          showOverlay('<i class="fa-solid fa-circle-xmark text-danger"></i>', 'ไม่สามารถบันทึกได้', data.message, 'text-danger');
        }
      } catch (error) {
        playBeep('error');
        showOverlay('<i class="fa-solid fa-triangle-exclamation text-danger"></i>', 'ข้อผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว', 'text-danger');
      } finally {
        setTimeout(() => { hideOverlay(); isCooldown = false; }, 2500);
      }
    }
    

    // รอรับผลลัพธ์จาก Google Apps Script
    window.addEventListener("message", (event) => {
      const data = event.data;
      if (data && data.type === "FAST_SCAN_RESULT") {
        if (data.success) {
          showOverlay('<i class="fa-solid fa-circle-check text-success"></i>', data.name, 'บันทึกข้อมูลเรียบร้อยแล้ว', 'text-success');
        } else {
          playBeep('error');
          showOverlay('<i class="fa-solid fa-circle-xmark text-danger"></i>', 'ไม่สามารถบันทึกได้', data.message, 'text-danger');
        }
        
        // หน่วงเวลาให้สตาฟฟ์อ่านชื่อ แล้วไปต่อ
        setTimeout(() => {
          hideOverlay();
          isCooldown = false;
        }, 2500);
      }
    });

    function isMobileOrTablet() {
      const ua = navigator.userAgent || "";
      return (/Android/i.test(ua) || /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1));
    }

    // ระบบเปิดกล้อง (อัปเกรดหารายชื่อกล้องหลังแบบแม่นยำ)
    async function startCamera() {
      if (isScanning) return;
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('scanBox').style.display = 'block';

      try {
        const formats = [
          Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93, Html5QrcodeSupportedFormats.CODABAR,
          Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.UPC_A
        ];
        html5QrCode = new Html5Qrcode("reader", { verbose: false, formatsToSupport: formats });
        
        const isDesktop = !isMobileOrTablet();
        const scanConfig = { 
          fps: 15, 
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const widthRatio = isDesktop ? 0.92 : 0.88;
            const heightRatio = isDesktop ? 0.42 : 0.35;
            return {
              width: Math.floor(viewfinderWidth * widthRatio),
              height: Math.floor(viewfinderHeight * heightRatio)
            };
          }, 
          aspectRatio: 16/9, 
          disableFlip: true,
          videoConstraints: {
            advanced: [{ focusMode: "continuous" }]
          }
        };

        // 🔴 [อัปเกรด] ระบบค้นหากล้องหลังแบบแม่นยำ (ป้องกันเปิดกล้องหน้า)
        let cameraConfig = { facingMode: "environment" }; // ค่าเริ่มต้น

        if (isMobileOrTablet()) {
          try {
            // ดึงรายชื่อกล้องทั้งหมดในเครื่อง
            const cameras = await Html5Qrcode.getCameras();
            if (cameras && cameras.length > 0) {
              // ค้นหากล้องที่มีคำระบุว่าเป็นกล้องหลัง
              const rearCamera = cameras.find(c => {
                const label = String(c.label || '').toLowerCase();
                return label.includes('back') || label.includes('rear') || label.includes('environment') || label.includes('หลัง');
              });

              if (rearCamera) {
                cameraConfig = { deviceId: { exact: rearCamera.id } }; // บังคับล็อกกล้องหลังตัวนี้
              } else {
                // ถ้าหาจากชื่อไม่เจอ ให้ดึงกล้องตัวสุดท้ายมาใช้ (ใน Android มักจะเป็นกล้องหลัง)
                cameraConfig = { deviceId: { exact: cameras[cameras.length - 1].id } };
              }
            }
          } catch (camErr) {
            console.log("ไม่สามารถดึงรายชื่อกล้องได้ ใช้ค่าเริ่มต้นแทน");
          }
        }

        // เริ่มเปิดกล้อง
        await html5QrCode.start(cameraConfig, scanConfig, onScanSuccess, () => {});
        isScanning = true;
        
        setTimeout(() => {
          const capabilities = html5QrCode.getRunningTrackCapabilities?.() || {};
          if (capabilities.torch || capabilities.torchFeature) {
             document.getElementById('btnTorch').style.display = 'flex';
          }
        }, 1500);

      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้: " + err);
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('scanBox').style.display = 'none';
      }
    }

    // ระบบเปิด/ปิดไฟฉาย
    async function toggleTorch() {
      if (!isScanning) return;
      try {
        isTorchOn = !isTorchOn;
        await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] });
        const btn = document.getElementById('btnTorch');
        if(isTorchOn) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      } catch (error) {
        alert("อุปกรณ์นี้ไม่รองรับการเปิดไฟฉายผ่านเบราว์เซอร์");
        isTorchOn = false;
        document.getElementById('btnTorch').classList.remove('active');
      }
    }
  </script>
</body>
</html>
